# Project 4: VoiceCore — Docker Compose
# Masimbonge Portfolio
# Run: docker-compose up --build

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"    # ← Edit: change if port 8000 is taken
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - WHISPER_MODEL=base      # ← Edit: tiny/base/small/medium/large
    volumes:
      - ./backend:/app          # hot reload in dev
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"    # ← Edit: change if port 3000 is taken
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/voice
    depends_on:
      - backend
    restart: unless-stopped
